# Vehicle presets for the XCAR-derived FastPlant.
#
# Common keys (all optional, defaults in fast_plant.DEFAULT_PARAMS):
#   lF/lR  : CG to front/rear axle [m]          Tf/Tr : front/rear track [m]
#   m      : total mass [kg]                    h     : CG height [m]
#   Iz     : yaw inertia [kg m^2]               g     : gravity [m/s^2]
#   rF/rR  : wheel radius [m]                   IwF/IwR : wheel spin inertia [kg m^2]
#   B/C/D/E: XCAR isotropic combined-slip Magic Formula (D = peak friction coefficient)
#   tyre_scale_front/rear : per-axle multiplier on D (front/rear balance)
#   slip_v_floor          : denominator floor of the slip ratio [m/s]
#   roll_share_front      : lambda_f, share of lateral load transfer on the front axle
#   rho_air, aero_Ax/Ay, aero_Cdx/Cdy, aero_Clx/Cly, aero_xp/zp, wind_x/y
#                         : one-pressure-center aerodynamic model (x fwd, y left, z up;
#                           Clx/Cly < 0 means downforce)
#   drivetrain            : rwd | fwd | awd | iwd (pedals mode)
#   gear_ratio            : motor-to-wheel reduction
#   max_power_w, motor    : torque envelope [[rpm, N m], ...] at the motor shaft
#   coast_torque_nm       : zero-pedal driveline drag, axle total [N m]
#   lsd_kd/lsd_tau_max    : viscous LSD coupling gain [N m s/rad] and per-side cap [N m]
#   brake_pressure_max_mpa, brake_torque_front/rear_nm_per_mpa
#   rolling_resistance    : rolling resistance coefficient
#   max_steer_rad         : front road wheel steering limit [rad]
#   wheel_speed_kp        : gain of the legacy wheel-speed command adapter

racecar:
  parameters:
    lF: 0.19
    lR: 0.1275
    T: 0.26
    m: 4.69
    h: 0.1
    g: 9.8
    Iz: 0.07
    B: 0.9
    C: 2.13
    D: 0.382
    E: 1.
    # --- FastPlant extensions ---
    rF: 0.0565
    rR: 0.0565
    IwF: 0.0024
    IwR: 0.0024
    slip_v_floor: 0.5
    slip_alpha_v_floor: 0.5
    roll_share_front: 0.55
    drivetrain: rwd
    gear_ratio: 1.0
    max_power_w: 600.
    motor: [[0., 1.0], [2000., 1.0], [6000., 0.4], [8000., 0.]]
    lsd_kd: 0.05
    lsd_tau_max: 0.6
    brake_pressure_max_mpa: 3.
    brake_torque_front_nm_per_mpa: 0.05
    brake_torque_rear_nm_per_mpa: 0.03
    rho_air: 1.206
    aero_Ax: 0.028
    aero_Ay: 0.09
    aero_Cdx: 0.35
    aero_Cdy: 1.0
    aero_Clx: 0.
    aero_Cly: 0.
    aero_xp: 0.
    aero_zp: 0.
    rolling_resistance: 0.012
    max_steer_rad: 0.45
    wheel_speed_kp: 2.

