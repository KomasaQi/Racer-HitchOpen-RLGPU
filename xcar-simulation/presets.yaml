# ---------------------------------------------------------------------------
# Full-size RWD EV race car, the FastPlant target for the CarSim EV conversion.
#
# Chassis data: CarSim 2019.0 "Exotic Sports Car / Exotic Racecar, Mid-Engine [L]"
#   sprung mass 1200 kg, CG height 375 mm, wheelbase 2650 mm (lF 1455 / lR 1195),
#   sprung yaw inertia 1065.2 kg m^2.  Total mass adds the unsprung corners
#   (~120 kg); total yaw inertia adds the unsprung contribution (~285 kg m^2).
# Powertrain: workspace 384 kW direct-drive motor map with the 3.44:1 final drive
#   of the CarSim rear-drive powertrain.  Brakes: 400 / 175 N m per MPa at 6 MPa.
# Aero: CarSim screenshot CdA = 0.80, ClA = 1.70 (downforce), Ax = 2.2 m^2,
#   Ay = 6.5 m^2, one pressure center at the CG (xp = zp = 0).
# Tire: one isotropic XCAR combined-slip curve, D = peak friction coefficient.
#   tyre_scale_front/rear carry the front/rear balance; the flat-road nominal
#   friction of the CarSim scenario is 1.0.
# ---------------------------------------------------------------------------
fullsize_racecar_ev:
  parameters:
    # CarSim LastRun_echo computed TOTAL-LADEN quantities.  Use these directly
    # because FastPlant has no sprung/unsprung bodies.  The old 1514.8 kg value
    # counted M_US as a per-corner mass although it is an axle subtotal, and also
    # missed that tire masses are added separately by CarSim.
    lF: 1.46257356
    lR: 1.18742644
    Tf: 1.720
    Tr: 1.600
    m: 1461.4
    h: 0.373483988
    g: 9.81
    Iz: 1693.469182
    # CarSim LastRun_echo: front RRE=332 mm, rear RRE=347 mm.  The previous
    # shared 332 mm radius inverted low-slip rear kappa at ordinary speeds.
    rF: 0.33200
    rR: 0.34700
    # IW=0.17 is the bare wheel only.  CarSim's computed ISPIN includes wheel+tire
    # and is the correct lumped inertia for FastPlant, which has no separate tire
    # rotational body: 1.77 front, 2.27 rear kg m^2.
    IwF: 1.77
    IwR: 2.27
    # Compact fit to the expanded CarSim pure-slip carpets.  Longitudinal peak
    # kappa ~= 0.0675; lateral peak alpha ~= 6.62 deg.
    B: 29.7734
    C: 1.85901
    D: 2.12460
    E: 0.980398
    bx: 29.7734
    cx: 1.85901
    ex: 0.980398
    by: 17.2982
    cy: 1.84047
    ey: 0.955634
    tyre_scale_front: 1.00
    tyre_scale_rear: 1.00
    slip_v_floor: 1.0
    slip_alpha_v_floor: 1.0
    # Final measured CarSim longitudinal-slip carpet point; CarSim uses flat
    # extrapolation beyond it.  This is deliberately not the first peak (~0.068).
    slip_force_plateau: 0.51
    # The lateral carpet likewise ends/flat-extrapolates at 25.5 degrees.
    slip_alpha_force_plateau_rad: 0.4450589593
    kappa_peak: 0.067524
    alpha_peak_rad: 0.115537
    # Fitted on true CarSim power-drift data.  The old shared ellipse had 0.268
    # normalized force RMSE; the documented normalized/theoretical transition
    # reduces it to 0.099 and improves all 36 held-out SI signal groups.
    # Compact analytic B/C/E curves plus one combined-slip blend.  CarSim
    # tables are used offline for calibration only, never queried at runtime.
    combined_slip_model: compact_transition
    combined_slip_blend: 0.49
    # Road friction lowers peak force more than origin stiffness.  These two
    # compact exponents passed force, local-flow and full-maneuver A/B gates.
    tire_mu_reference: 2.12460
    tire_stiffness_grip_exponent_x: 0.20
    tire_stiffness_grip_exponent_y: 0.40
    load_sensitivity: 0.15358
    load_sensitivity_model: power
    fz_ref_front: 3460.843
    fz_ref_rear: 5537.353
    # Three-road load snapshots + held-out local-flow checks (2026-11-14).
    roll_share_front: 0.455
    drivetrain: rwd
    gear_ratio: 3.44
    drive_efficiency: 0.99
    motor_efficiency: 1.00
    motor_tau: 0.05  # CarSim TC_MOTOR, distinct from external pedal actuator lag
    throttle_power_gain: 1.00
    throttle_power_rolloff: 0.00
    # Expanded CarSim pars: IMOTOR/I_MOTOR=0.0226, IDS=0.013,
    # IHS_LR=IHS_RR=0.009 kg m^2.
    motor_inertia: 0.0226
    diff_input_inertia: 0.013
    halfshaft_inertia: 0.009
    # Expanded HEV/battery pars at reset SOC=.8: 120 series packs,
    # VOC=7.8078 V/cell, Vmin=6 V/cell, Rdischarge=1 mOhm/cell.
    battery_voc_v: 936.936
    battery_min_voltage_v: 720.0
    battery_resistance_ohm: 0.12
    battery_power_limit_scale: 1.0
    use_battery_torque_envelope: true
    # A rear-drive car that can hold 20-40 degrees of sideslip needs its rear axle to
    # saturate laterally well before the front, and enough power to keep spinning it.
    # Measured: with mu_y_rear 0.85 the sustained sideslip was pinned at 0.14-0.16 rad
    # across every speed, tyre model and reward weight tried.
    mu_y_ratio: 1.00
    mu_y_ratio_rear: 1.00
    # CarSim PWR_HEV_DRV_MAX / PWR_EV_MODE / driver-demand table: 384 kW.
    max_power_w: 384000.
    motor: [[0., 2400.], [250., 2400.], [500., 2400.], [750., 2400.],
            [1000., 2400.], [1250., 2400.], [1500., 2400.], [1600., 2293.62],
            [1800., 2038.77], [2000., 1834.89], [2500., 1467.91], [3000., 1223.26],
            [3500., 1048.51], [4000., 917.45], [4500., 815.51], [5000., 733.96],
            [5500., 667.23], [6000., 611.63], [6500., 564.58], [7000., 524.26],
            [7500., 489.30], [8000., 458.72], [8500., 431.74], [9000., 407.75],
            [9200., 398.89]]
    coast_torque_nm: 0.0
    wheel_speed_kp: 600.
    # CarSim M_DIFF_VISC_TABLE is an odd generalized-viscous law:
    # |T_L-T_R| = 90.09*(|n_L-n_R|/60 rpm)^0.5 N m.  The 31-point carpet is
    # used only to identify these two compact physical parameters.
    lsd_model: power_law
    lsd_ref_rpm: 60.0
    lsd_torque_ref: 90.09
    lsd_exponent: 0.50
    lsd_kd: 20.0  # legacy linear model only
    lsd_tau_max: 300.0
    brake_pressure_max_mpa: 6.0
    # Calibrated against CarSim (measured -0.39 / -1.02 / -2.27 m/s per second at
    # 0.05 / 0.10 / 0.20 pedal).  These values OVERRIDE the defaults in fast_plant,
    # so the earlier 3x calibration was never active.
    # Calibrated against the CarSim sweep (0.05 / 0.10 / 0.20 pedal -> -0.39 / -1.02 /
    # -2.27 m/s per second).  With the backward-Euler wheel solve the plant's brake is
    # progressive, so no single gain matches all three points exactly; this pair gives
    # -0.53 / -0.93 / -1.74, which brackets the CarSim curve.
    brake_torque_front_nm_per_mpa: 240.0
    brake_torque_rear_nm_per_mpa: 105.0
    rho_air: 1.206
    aero_Ax: 2.20
    aero_Ay: 6.50
    aero_Cdx: 0.364
    aero_Cdy: 1.00
    aero_Clx: -0.773
    aero_Cly: 0.0
    aero_xp: 0.0
    aero_zp: 0.0
    rolling_resistance: 0.012
    max_steer_rad: 0.45
    # Complete micro/macro CarSim gate: <0.3% aggregate NRMSE change versus
    # 16 iterations, while improving 20k-env throughput by about 24%.
    wheel_solver_bisection_iters: 12
