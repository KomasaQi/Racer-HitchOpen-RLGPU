# ---------------------------------------------------------------------------
# Full-size RWD EV race car, the FastPlant target for the CarSim EV conversion.
#
# Chassis data: CarSim 2019.0 "Exotic Sports Car / Exotic Racecar, Mid-Engine [L]"
#   sprung mass 1200 kg, CG height 375 mm, wheelbase 2650 mm (lF 1455 / lR 1195),
#   sprung yaw inertia 1065.2 kg m^2.  Total mass adds the unsprung corners
#   (~120 kg); total yaw inertia adds the unsprung contribution (~285 kg m^2).
# Powertrain: workspace 384 kW direct-drive motor map with the 3.44:1 final drive
#   of the CarSim rear-drive powertrain.  Brakes: 400 / 175 N m per MPa at 6 MPa.
# Aero: CarSim screenshot CdA = 0.80, ClA = 1.70 (downforce), Ax = 2.2 m^2,
#   Ay = 6.5 m^2, one pressure center at the CG (xp = zp = 0).
# Tire: one isotropic XCAR combined-slip curve, D = peak friction coefficient.
#   tyre_scale_front/rear carry the front/rear balance; the flat-road nominal
#   friction of the CarSim scenario is 1.0.
# ---------------------------------------------------------------------------
fullsize_racecar_ev:
  parameters:
    lF: 1.455
    lR: 1.195
    # Matched to the CarSim vehicle ("Exotic Racecar, Mid-Engine"), read from its
    # own pars: sprung mass 1200 kg, unsprung 65.7 kg front and 91.7 kg rear per
    # corner, so the total is 1514.8 kg.  Iz is the sprung 1065.2 plus the unsprung
    # contributions about the CG (2*65.7*1.455^2 + 2*91.7*1.195^2) = 1605.3 kg m^2.
    # The earlier 1987 kg figure came from summing Fz at 200 km/h, which includes
    # aerodynamic downforce -- that was wrong.
    Tf: 1.720
    Tr: 1.600
    m: 1514.8
    h: 0.375
    g: 9.81
    Iz: 1605.3
    rF: 0.33200
    rR: 0.33200
    # CarSim wheel spin inertia is IW = 0.17 kg m^2 for every wheel; the previous
    # 1.9 / 2.2 were 11x too high, which changes wheel-spin transients, i.e. exactly
    # the four wheel-speed channels the actor sees.
    IwF: 0.17
    IwR: 0.17
    # isotropic XCAR tire, peak at ~0.11 combined slip
    # throttle-map evidence: with B 10 the GPU car peaks at 15.0 m/s at 0.45 throttle
    # and then gets SLOWER (13.9 at 0.60, 12.4 at 1.00) because the rear axle spins;
    # CarSim rises monotonically to 21.8 m/s.  B 6, i.e. a later force peak, plus a
    # stronger rear axle reproduces the monotonic rise: 17.5 / 22.0 / 23.4 / 23.8.
    B: 6.0
    C: 1.90
    D: 1.00
    E: 0.97
    tyre_scale_front: 1.00
    tyre_scale_rear: 1.40
    slip_v_floor: 1.0
    slip_alpha_v_floor: 1.0
    load_sensitivity: 0.0
    roll_share_front: 0.55
    drivetrain: rwd
    gear_ratio: 3.44
    drive_efficiency: 0.92
    # A rear-drive car that can hold 20-40 degrees of sideslip needs its rear axle to
    # saturate laterally well before the front, and enough power to keep spinning it.
    # Measured: with mu_y_rear 0.85 the sustained sideslip was pinned at 0.14-0.16 rad
    # across every speed, tyre model and reward weight tried.
    mu_y_ratio_rear: 0.65
    max_power_w: 500000.
    motor: [[0., 2400.], [250., 2400.], [500., 2400.], [750., 2400.],
            [1000., 2400.], [1250., 2400.], [1500., 2400.], [1600., 2293.62],
            [1800., 2038.77], [2000., 1834.89], [2500., 1467.91], [3000., 1223.26],
            [3500., 1048.51], [4000., 917.45], [4500., 815.51], [5000., 733.96],
            [5500., 667.23], [6000., 611.63], [6500., 564.58], [7000., 524.26],
            [7500., 489.30], [8000., 458.72], [8500., 431.74], [9000., 407.75],
            [9200., 398.89]]
    coast_torque_nm: 0.0
    wheel_speed_kp: 600.
    lsd_kd: 20.0
    lsd_tau_max: 300.0
    brake_pressure_max_mpa: 6.0
    # Calibrated against CarSim (measured -0.39 / -1.02 / -2.27 m/s per second at
    # 0.05 / 0.10 / 0.20 pedal).  These values OVERRIDE the defaults in fast_plant,
    # so the earlier 3x calibration was never active.
    # Calibrated against the CarSim sweep (0.05 / 0.10 / 0.20 pedal -> -0.39 / -1.02 /
    # -2.27 m/s per second).  With the backward-Euler wheel solve the plant's brake is
    # progressive, so no single gain matches all three points exactly; this pair gives
    # -0.53 / -0.93 / -1.74, which brackets the CarSim curve.
    brake_torque_front_nm_per_mpa: 240.0
    brake_torque_rear_nm_per_mpa: 105.0
    rho_air: 1.206
    aero_Ax: 2.20
    aero_Ay: 6.50
    aero_Cdx: 0.364
    aero_Cdy: 1.00
    aero_Clx: -0.773
    aero_Cly: 0.0
    aero_xp: 0.0
    aero_zp: 0.0
    rolling_resistance: 0.012
    max_steer_rad: 0.45
